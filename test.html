<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景测试</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
        }
        #debug-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug-info">加载中...</div>
    
    <script src="js/lib/three.min.js"></script>
    <script src="js/scene.js"></script>
    <script>
        window.addEventListener('load', function() {
            const debugInfo = document.getElementById('debug-info');
            
            // 检查Three.js是否加载
            if (typeof THREE === 'undefined') {
                debugInfo.innerHTML = '错误: Three.js 未加载!';
                debugInfo.style.color = 'red';
                return;
            }
            
            debugInfo.innerHTML += '<br>Three.js 已加载, 版本: ' + THREE.REVISION;
            
            // 初始化场景
            if (initScene()) {
                debugInfo.innerHTML += '<br>场景初始化成功!';
                
                // 创建测试场景
                testScene();
            } else {
                debugInfo.innerHTML += '<br>场景初始化失败, 请查看控制台错误信息';
                debugInfo.style.color = 'red';
            }
        });
    </script>
</body>
</html>
